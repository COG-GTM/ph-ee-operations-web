<div class="container">

  <mat-card appearance="outlined">

    <div fxLayout="row" fxLayout.lt-md="column">

      <div fxFlex="50%">

        <mat-nav-list>

          <mat-list-item [routerLink]="['roles-and-permissions']">
            <mat-icon matListItemIcon>
              <fa-icon icon="key" size="sm"></fa-icon>
            </mat-icon>
            <span matListItemTitle>Manage Roles and Permissions</span>
            <span matListItemLine>Define or modify roles and associated permissions</span>
          </mat-list-item>

        </mat-nav-list>

      </div>

      <div fxFlex="50%">

        <mat-nav-list>

          <mat-list-item [routerLink]="['audit-trails']">
            <mat-icon matListItemIcon>
              <fa-icon icon="money-check" size="sm"></fa-icon>
            </mat-icon>
            <span matListItemTitle>Audit Trails</span>
            <span matListItemLine>Audit logs of all the activities, such as create client, disburse loans etc</span>
          </mat-list-item>

        </mat-nav-list>

      </div>

    </div>

  </mat-card>

</div>
