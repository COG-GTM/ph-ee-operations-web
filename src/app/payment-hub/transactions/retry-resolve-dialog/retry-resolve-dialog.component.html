<h2 mat-dialog-title>Are you sure? You want to
  @if (action==='retry') {
    <div>Retry ({{workflowInstanceKey}})</div>
  }
  @if (action==='resolve') {
    <div>Resolve ({{workflowInstanceKey}})</div>
  }
</h2>

<mat-dialog-actions>
  <button mat-raised-button color="warn"  [mat-dialog-close]="">Close</button>
  <button mat-raised-button color="primary" (click)="takeAction()">Confirm</button>
</mat-dialog-actions>
